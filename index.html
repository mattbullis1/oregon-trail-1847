<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b140d">
  <meta name="description" content="A modern touch remake of the 1978 Oregon Trail simulation. Coded graphics, no keyboard required.">
  <title>The Oregon Trail - 1847</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" hidden>

    <header class="hud">
      <div class="hud-top">
        <div class="brand">OREGON TRAIL <span>1847</span></div>
        <button id="menu-btn" class="icon-btn" type="button" aria-label="Open menu">
          <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
        </button>
      </div>
      <div class="hud-dates">
        <strong id="hud-date">MONDAY MARCH 29 1847</strong>
        <span id="hud-miles">0 / 2040 MI</span>
      </div>
      <div class="progress"><div id="hud-progress"></div></div>
      <span id="hud-health" class="health-badge" hidden></span>
      <div class="chips" id="hud-chips"></div>
    </header>

    <section class="stage">
      <canvas id="scene" aria-label="Animated trail scene"></canvas>
      <div class="caption" id="caption">INDEPENDENCE, MISSOURI - 1847</div>
    </section>

    <section class="log" id="log" aria-live="polite"></section>

    <section class="panel" id="panel"></section>

  </div>

  <section id="title-screen" class="title-screen" hidden></section>

  <div id="overlay" class="overlay" hidden><div class="sheet" id="sheet"></div></div>

  <div id="boot" class="boot">LOADING THE TRAIL...</div>
  <div id="fatal" class="fatal" hidden></div>

  <script>
    // Fail-safe: if the module never boots, say so plainly instead of hanging.
    window.setTimeout(function () {
      if (!document.documentElement.dataset.appReady) {
        var boot = document.getElementById('boot');
        if (boot) boot.textContent = 'SCRIPTS DID NOT LOAD - CHECK THE BROWSER CONSOLE';
      }
    }, 5000);
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
